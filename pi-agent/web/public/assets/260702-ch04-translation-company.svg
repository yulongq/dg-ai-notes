  <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
    </defs>

    <rect width="960" height="620" fill="#faf7f2"/>

    <!-- ===== Layer 1: 客户 (Agent Loop) ===== -->
    <g>
      <rect x="280" y="30" width="400" height="80" rx="6" fill="rgba(28,25,23,0.05)" stroke="rgba(28,25,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="296" y="42" width="56" height="14" rx="2" fill="rgba(28,25,23,0.05)" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="324" y="53" fill="#57534e" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="480" y="76" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">Agent Loop</text>
      <text x="480" y="96" fill="#57534e" font-size="10" font-family="'Geist Mono', monospace"
            text-anchor="middle">streamSimple(model, context, options)</text>
    </g>

    <line x1="480" y1="110" x2="480" y2="148" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== Layer 1: 顶层分派入口 ===== -->
    <g>
      <rect x="160" y="152" width="640" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="176" y="164" width="76" height="14" rx="2" fill="rgba(181,82,58,0.10)" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
      <text x="214" y="175" fill="#b5523a" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">LAYER 1 · 入口</text>
      <text x="480" y="196" fill="#1c1917" font-size="14" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">前台：streamSimple()</text>
      <text x="480" y="216" fill="#57534e" font-size="10" font-family="'Geist', sans-serif"
            text-anchor="middle">内置 Models 路径，或 resolveApiProvider(model.api) 注册表路径</text>
    </g>

    <!-- Dispatch notes -->
    <text x="40" y="195" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
          letter-spacing="0.10em">COMPAT REGISTRY</text>
    <text x="40" y="211" fill="#1c1917" font-size="9" font-family="'Geist', sans-serif">"通讯录"</text>
    <text x="40" y="226" fill="#a8a29e" font-size="9" font-family="'Geist', sans-serif">BUILTIN_APIS[]</text>

    <text x="820" y="195" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
          letter-spacing="0.08em">ADAPTER LOCAL</text>
    <text x="820" y="211" fill="#1c1917" font-size="9" font-family="'Geist', sans-serif">streamSimple → stream</text>
    <text x="820" y="226" fill="#a8a29e" font-size="9" font-family="'Geist', sans-serif">不回到顶层入口</text>

    <!-- Request dispatch: top-level streamSimple -> adapter streamSimple -> local stream -->
    <line x1="480" y1="232" x2="480" y2="252" stroke="#57534e" stroke-width="1"/>
    <line x1="200" y1="252" x2="840" y2="252" stroke="#57534e" stroke-width="1"/>
    <rect x="360" y="235" width="240" height="14" rx="2" fill="#faf7f2"/>
    <text x="480" y="247" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle">REQUEST · 按 Provider / model.api 分派</text>
    <line x1="200" y1="252" x2="200" y2="282" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="420" y1="252" x2="420" y2="282" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="640" y1="252" x2="640" y2="282" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="840" y1="252" x2="840" y2="282" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== Layer 3: API adapters ===== -->
    <text x="40" y="294" fill="#57534e" font-size="7" font-family="'Geist Mono', monospace"
          letter-spacing="0.10em">API</text>
    <text x="40" y="306" fill="#57534e" font-size="7" font-family="'Geist Mono', monospace"
          letter-spacing="0.10em">ADAPTERS</text>
    <text x="40" y="324" fill="#1c1917" font-size="8" font-family="'Geist', sans-serif">一种协议</text>
    <text x="40" y="338" fill="#1c1917" font-size="8" font-family="'Geist', sans-serif">一个适配器</text>

    <g>
      <rect x="100" y="286" width="200" height="124" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="100" y="286" width="200" height="28" rx="6" fill="rgba(28,25,23,0.05)"/>
      <text x="200" y="304" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">Anthropic API 适配器</text>
      <text x="200" y="334" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">api: "anthropic-messages"</text>
      <line x1="120" y1="348" x2="280" y2="348" stroke="rgba(28,25,23,0.08)" stroke-width="0.6"/>
      <text x="200" y="366" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">SDK 请求 + 自解析 SSE</text>
      <text x="200" y="382" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">content_block → text_*</text>
      <text x="200" y="398" fill="#a8a29e" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle" font-style="italic">可供多个模型复用</text>
    </g>

    <g>
      <rect x="320" y="286" width="200" height="124" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="320" y="286" width="200" height="28" rx="6" fill="rgba(28,25,23,0.05)"/>
      <text x="420" y="304" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">OpenAI API 适配器</text>
      <text x="420" y="334" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">api: "openai-completions"</text>
      <line x1="340" y1="348" x2="500" y2="348" stroke="rgba(28,25,23,0.08)" stroke-width="0.6"/>
      <text x="420" y="366" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">用官方 SDK</text>
      <text x="420" y="382" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chunk.delta → text_*</text>
      <text x="420" y="398" fill="#a8a29e" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle" font-style="italic">兼容端点也可复用</text>
    </g>

    <g>
      <rect x="540" y="286" width="200" height="124" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="540" y="286" width="200" height="28" rx="6" fill="rgba(28,25,23,0.05)"/>
      <text x="640" y="304" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">Google API 适配器</text>
      <text x="640" y="334" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">api: "google-generative-ai"</text>
      <line x1="560" y1="348" x2="720" y2="348" stroke="rgba(28,25,23,0.08)" stroke-width="0.6"/>
      <text x="640" y="366" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">content → parts</text>
      <text x="640" y="382" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thinkingConfig</text>
      <text x="640" y="398" fill="#a8a29e" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle" font-style="italic">字段与事件各自翻译</text>
    </g>

    <g>
      <rect x="760" y="286" width="160" height="124" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="760" y="286" width="160" height="28" rx="6" fill="rgba(28,25,23,0.05)"/>
      <text x="840" y="304" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">Bedrock API 适配器</text>
      <text x="840" y="334" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle">api: "bedrock-converse-stream"</text>
      <line x1="776" y1="348" x2="904" y2="348" stroke="rgba(28,25,23,0.08)" stroke-width="0.6"/>
      <text x="840" y="366" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">AWS Converse Stream</text>
      <text x="840" y="382" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">受支持模型用 cachePoint</text>
      <text x="840" y="398" fill="#a8a29e" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle" font-style="italic">Provider: amazon-bedrock</text>
    </g>

    <!-- Response direction: adapters emit the common protocol -->
    <line x1="200" y1="410" x2="200" y2="444" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
    <line x1="420" y1="410" x2="420" y2="444" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
    <line x1="640" y1="410" x2="640" y2="444" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
    <path d="M 840 410 V 428 H 760 V 444" fill="none" stroke="#2e5aa8" stroke-width="1"
          marker-end="url(#arrow-link)"/>

    <!-- ===== Layer 2: common event protocol ===== -->
    <g>
      <rect x="160" y="448" width="640" height="60" rx="6" fill="rgba(181,82,58,0.06)" stroke="#b5523a" stroke-width="1.2"/>
      <rect x="176" y="460" width="156" height="14" rx="2" fill="rgba(181,82,58,0.10)" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
      <text x="254" y="471" fill="#b5523a" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">LAYER 2 · 事件协议</text>
      <text x="480" y="490" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">统一输出：12 种 AssistantMessageEvent</text>
      <text x="480" y="502" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">start · text_* · thinking_* · toolcall_* · done · error</text>
    </g>

    <!-- The standardized stream returns to the client; arrow direction ends at Agent Loop. -->
    <path d="M 800 478 H 930 V 70 H 680" fill="none" stroke="#2e5aa8" stroke-width="1.2"
          stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
    <text x="944" y="286" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.05em" transform="rotate(-90 944 286)">统一事件流返回</text>

    <!-- 底部 insight -->
    <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
    <text x="40" y="568" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
          letter-spacing="0.14em">INSIGHT</text>
    <text x="120" y="568" fill="#1c1917" font-size="10" font-family="'Geist', sans-serif" font-style="italic">
      顶层只分派一次；参数映射与本地 stream() 都发生在选中的 API 适配器内。
    </text>
  </svg>
