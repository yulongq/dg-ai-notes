  <svg viewBox="0 0 960 560" role="img" aria-labelledby="pipeline-title pipeline-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="pipeline-title">AgentMessage 到供应商私有协议的五阶段管道</title>
    <desc id="pipeline-desc">AgentMessage 数组先经过可选的 transformContext，再由 convertToLlm 投影或过滤成 pi-ai Message 数组，最后由 Provider adapter 翻译成供应商私有请求协议。Compaction 由 AgentSession 管理，不属于 transformContext。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
      </marker>
      <style>
        .sans { font-family: 'Geist', 'PingFang SC', sans-serif; }
        .mono { font-family: 'Geist Mono', monospace; }
        .serif { font-family: 'Instrument Serif', 'Source Han Serif SC', serif; }
        .ink { fill: #1c1917; }
        .muted { fill: #57534e; }
        .soft { fill: #57534e; }
        .accent { fill: #b5523a; }
        .step { font-size: 9px; letter-spacing: .14em; }
        .heading { font-size: 11px; font-weight: 600; }
        .body { font-size: 10px; }
        .small { font-size: 10px; }
      </style>
    </defs>

    <rect width="960" height="560" fill="#faf7f2"/>

    <!-- Phase rail -->
    <line x1="28" y1="72" x2="932" y2="72" stroke="rgba(28,25,23,.16)"/>
    <rect x="28" y="63" width="174" height="18" fill="#faf7f2"/>
    <text x="115" y="76" class="mono muted step" text-anchor="middle">AGENT STATE</text>
    <rect x="218" y="63" width="554" height="18" fill="#faf7f2"/>
    <text x="495" y="76" class="mono accent step" text-anchor="middle">REQUEST PREPARATION</text>
    <rect x="788" y="63" width="144" height="18" fill="#faf7f2"/>
    <text x="860" y="76" class="mono muted step" text-anchor="middle">PROVIDER EDGE</text>

    <!-- Stage 1 -->
    <rect x="20" y="104" width="168" height="236" rx="7" fill="#fff" stroke="rgba(28,25,23,.24)"/>
    <rect x="20" y="104" width="168" height="42" rx="7" fill="rgba(28,25,23,.045)"/>
    <text x="36" y="122" class="mono muted step">01 · INPUT</text>
    <text x="36" y="139" class="sans ink heading">AgentMessage[]</text>

    <text x="36" y="173" class="mono muted small">3 种 pi-ai Message</text>
    <text x="36" y="196" class="sans ink body">UserMessage</text>
    <text x="36" y="214" class="sans ink body">AssistantMessage</text>
    <text x="36" y="232" class="sans ink body">ToolResultMessage</text>
    <line x1="36" y1="250" x2="172" y2="250" stroke="rgba(28,25,23,.10)"/>
    <text x="36" y="273" class="mono accent small">4 种 custom</text>
    <text x="36" y="296" class="sans muted body">Bash · Compaction</text>
    <text x="36" y="314" class="sans muted body">Branch · Custom</text>

    <!-- Stage 2 -->
    <rect x="213" y="104" width="168" height="236" rx="7" fill="#fff" stroke="rgba(28,25,23,.24)"/>
    <rect x="213" y="104" width="168" height="42" rx="7" fill="rgba(28,25,23,.045)"/>
    <text x="229" y="122" class="mono muted step">02 · OPTIONAL</text>
    <text x="229" y="139" class="sans ink heading">transformContext</text>

    <text x="229" y="173" class="sans ink body" font-weight="600">请求级整理</text>
    <text x="229" y="199" class="sans muted body">· 过滤</text>
    <text x="229" y="220" class="sans muted body">· 重排</text>
    <text x="229" y="241" class="sans muted body">· 注入</text>
    <line x1="229" y1="261" x2="365" y2="261" stroke="rgba(28,25,23,.10)"/>
    <text x="229" y="286" class="mono soft small">AgentMessage[]</text>
    <text x="229" y="304" class="mono soft small">→ AgentMessage[]</text>
    <text x="229" y="325" class="sans soft small">类型保持不变</text>

    <!-- Stage 3 -->
    <rect x="406" y="104" width="168" height="236" rx="7" fill="rgba(181,82,58,.055)" stroke="#b5523a" stroke-width="1.3"/>
    <rect x="406" y="104" width="168" height="42" rx="7" fill="rgba(181,82,58,.095)"/>
    <text x="422" y="122" class="mono accent step">03 · REQUIRED</text>
    <text x="422" y="139" class="sans ink heading">convertToLlm</text>

    <text x="422" y="173" class="sans ink body" font-weight="600">投影 / 过滤 custom</text>
    <text x="422" y="199" class="sans muted body">pi-ai Message 原样通过</text>
    <text x="422" y="224" class="sans muted body">其余 custom</text>
    <text x="422" y="242" class="mono accent small">→ UserMessage</text>
    <line x1="422" y1="261" x2="558" y2="261" stroke="rgba(181,82,58,.18)"/>
    <text x="422" y="284" class="sans accent small">仅 Bash 且标记排除：</text>
    <text x="422" y="304" class="mono accent small">excludeFromContext</text>
    <text x="422" y="323" class="mono accent small">=== true → []</text>

    <!-- Stage 4 -->
    <rect x="599" y="104" width="168" height="236" rx="7" fill="#fff" stroke="rgba(28,25,23,.24)"/>
    <rect x="599" y="104" width="168" height="42" rx="7" fill="rgba(28,25,23,.045)"/>
    <text x="615" y="122" class="mono muted step">04 · PI-AI OUTPUT</text>
    <text x="615" y="139" class="sans ink heading">Message[]</text>

    <text x="615" y="173" class="sans ink body" font-weight="600">统一内部协议</text>
    <text x="615" y="199" class="sans muted body">UserMessage</text>
    <text x="615" y="220" class="sans muted body">AssistantMessage</text>
    <text x="615" y="241" class="sans muted body">ToolResultMessage</text>
    <line x1="615" y1="261" x2="751" y2="261" stroke="rgba(28,25,23,.10)"/>
    <text x="615" y="286" class="sans accent small">不是 LLM / API</text>
    <text x="615" y="304" class="sans accent small">直接认识的格式</text>

    <!-- Stage 5 -->
    <rect x="792" y="104" width="148" height="236" rx="7" fill="rgba(28,25,23,.025)" stroke="rgba(28,25,23,.35)"/>
    <rect x="792" y="104" width="148" height="42" rx="7" fill="rgba(28,25,23,.055)"/>
    <text x="808" y="122" class="mono muted step">05 · ADAPTER</text>
    <text x="808" y="139" class="sans ink heading">Provider</text>

    <text x="808" y="173" class="sans ink body" font-weight="600">供应商边界翻译</text>
    <text x="808" y="199" class="sans muted body">Anthropic</text>
    <text x="808" y="220" class="sans muted body">OpenAI</text>
    <text x="808" y="241" class="sans muted body">Google · …</text>
    <line x1="808" y1="261" x2="924" y2="261" stroke="rgba(28,25,23,.10)"/>
    <text x="808" y="286" class="mono soft small">Message[]</text>
    <text x="808" y="304" class="mono soft small">→ private request</text>
    <text x="808" y="325" class="sans accent small">私有协议</text>

    <!-- Connecting arrows -->
    <line x1="188" y1="222" x2="207" y2="222" stroke="#57534e" marker-end="url(#arrow)"/>
    <line x1="381" y1="222" x2="400" y2="222" stroke="#57534e" marker-end="url(#arrow)"/>
    <line x1="574" y1="222" x2="593" y2="222" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="767" y1="222" x2="786" y2="222" stroke="#57534e" marker-end="url(#arrow)"/>

    <!-- Ownership notes -->
    <line x1="297" y1="340" x2="297" y2="375" stroke="#b5523a" stroke-dasharray="4 3"/>
    <rect x="199" y="379" width="196" height="66" rx="5" fill="rgba(181,82,58,.04)" stroke="rgba(181,82,58,.30)" stroke-dasharray="4 3"/>
    <text x="215" y="402" class="mono accent step">NOT COMPACTION</text>
    <text x="215" y="424" class="sans ink body">内置 Compaction 由</text>
    <text x="215" y="439" class="sans muted body">AgentSession 在运行后管理</text>

    <line x1="490" y1="340" x2="490" y2="375" stroke="#57534e" stroke-dasharray="4 3"/>
    <rect x="412" y="379" width="350" height="66" rx="5" fill="rgba(28,25,23,.02)" stroke="rgba(28,25,23,.18)"/>
    <text x="428" y="402" class="mono muted step">BOUNDARY CONTRACT</text>
    <text x="428" y="424" class="sans ink body">convertToLlm 只输出 pi-ai Message[]；</text>
    <text x="428" y="439" class="sans muted body">供应商格式转换留给后续 Provider adapter。</text>

    <!-- Closing principle -->
    <line x1="20" y1="482" x2="940" y2="482" stroke="rgba(28,25,23,.12)"/>
    <text x="20" y="508" class="mono muted step">SEPARATION OF CONCERNS</text>
    <text x="20" y="535" class="serif ink" font-size="13" font-style="italic">
      请求整理不改变类型；消息投影不猜供应商；协议适配只发生在 Provider 边界。
    </text>
  </svg>
