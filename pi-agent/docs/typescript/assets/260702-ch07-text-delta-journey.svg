  <svg viewBox="0 0 960 910" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="journey-title journey-desc">
    <title id="journey-title">text_delta 从 Provider 私有数据块到 TUI 差分渲染的六站旅程</title>
    <desc id="journey-desc">供应商私有 chunk 经过 pi-ai 适配器归一化，Agent Loop 发出带累计消息的 message_update，Agent core 等待核心监听器，AgentSession 等待扩展但不等待 Session 监听器返回的 Promise，TUI 最终读取累计消息并差分渲染。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
      </marker>
      <filter id="paper-shadow" x="-5%" y="-10%" width="110%" height="120%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1c1917" flood-opacity="0.06"/>
      </filter>
    </defs>
    <rect width="960" height="910" fill="#faf7f2"/>

    <!-- Journey rail -->
    <text x="62" y="27" fill="#b5523a" font-size="9" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.16em">STREAM</text>
    <text x="104" y="27" fill="#a8a29e" font-size="9" font-family="'Geist Mono', monospace"
          letter-spacing="0.12em">PRIVATE CHUNK</text>
    <line x1="245" y1="24" x2="805" y2="24" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
    <text x="920" y="27" fill="#a8a29e" font-size="9" font-family="'Geist Mono', monospace"
          text-anchor="end" letter-spacing="0.12em">RENDERED MESSAGE</text>
    <line x1="62" y1="66" x2="62" y2="778" stroke="rgba(181,82,58,0.32)" stroke-width="2"/>

    <!-- 01 · Provider-private chunk -->
    <g>
      <circle cx="62" cy="95" r="20" fill="#faf7f2" stroke="#b5523a" stroke-width="1.3"/>
      <text x="62" y="99" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace"
            font-weight="600" text-anchor="middle">01</text>
      <rect x="104" y="48" width="816" height="106" rx="7" fill="#fffdfa"
            stroke="rgba(28,25,23,0.16)" filter="url(#paper-shadow)"/>
      <text x="128" y="73" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">PROVIDER 私有流</text>
      <text x="128" y="98" fill="#1c1917" font-size="16" font-family="'Geist', sans-serif"
            font-weight="600">供应商 chunk 仍是各自协议</text>
      <rect x="128" y="114" width="354" height="34" rx="3" fill="#f3eee7"/>
      <text x="140" y="135" fill="#57534e" font-size="10" font-family="'Geist Mono', monospace">Anthropic · content_block_delta → delta.text</text>
      <rect x="494" y="114" width="402" height="34" rx="3" fill="#f3eee7"/>
      <text x="506" y="128" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace">OpenAI Chat Completions（openai-completions）</text>
      <text x="506" y="143" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace">choices[0].delta.content</text>
    </g>
    <line x1="62" y1="116" x2="62" y2="175" stroke="#b5523a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 02 · pi-ai adapter -->
    <g>
      <circle cx="62" cy="225" r="20" fill="#faf7f2" stroke="#b5523a" stroke-width="1.3"/>
      <text x="62" y="229" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace"
            font-weight="600" text-anchor="middle">02</text>
      <rect x="104" y="178" width="816" height="106" rx="7" fill="#fffdfa"
            stroke="rgba(28,25,23,0.16)" filter="url(#paper-shadow)"/>
      <text x="128" y="203" fill="#b5523a" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">pi-ai · PROVIDER ADAPTER</text>
      <text x="128" y="228" fill="#1c1917" font-size="16" font-family="'Geist', sans-serif"
            font-weight="600">归一化为统一的 AssistantMessageEvent</text>
      <rect x="128" y="244" width="768" height="25" rx="3" fill="rgba(181,82,58,0.07)"/>
      <text x="140" y="261" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace">type: "text_delta" · delta: "你" · partial: AssistantMessage</text>
      <text x="884" y="261" fill="#57534e" font-size="9" font-family="'Geist', sans-serif"
            text-anchor="end">partial 是截至此刻的累计消息</text>
    </g>
    <line x1="62" y1="246" x2="62" y2="305" stroke="#b5523a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 03 · Agent Loop -->
    <g>
      <circle cx="62" cy="355" r="20" fill="#faf7f2" stroke="#b5523a" stroke-width="1.3"/>
      <text x="62" y="359" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace"
            font-weight="600" text-anchor="middle">03</text>
      <rect x="104" y="308" width="816" height="106" rx="7" fill="#fffdfa"
            stroke="rgba(28,25,23,0.16)" filter="url(#paper-shadow)"/>
      <text x="128" y="333" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">AGENT LOOP · EVENT CONVERSION</text>
      <text x="128" y="358" fill="#1c1917" font-size="16" font-family="'Geist', sans-serif"
            font-weight="600">包装为 message_update，同时保留两种视角</text>
      <rect x="128" y="374" width="338" height="25" rx="3" fill="#f3eee7"/>
      <text x="140" y="391" fill="#57534e" font-size="10" font-family="'Geist Mono', monospace">message · 当前累计 AssistantMessage</text>
      <rect x="478" y="374" width="418" height="25" rx="3" fill="#f3eee7"/>
      <text x="490" y="391" fill="#57534e" font-size="10" font-family="'Geist Mono', monospace">assistantMessageEvent · 原始归一化事件</text>
    </g>
    <line x1="62" y1="376" x2="62" y2="435" stroke="#b5523a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 04 · Agent core -->
    <g>
      <circle cx="62" cy="485" r="20" fill="#faf7f2" stroke="#b5523a" stroke-width="1.3"/>
      <text x="62" y="489" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace"
            font-weight="600" text-anchor="middle">04</text>
      <rect x="104" y="438" width="816" height="106" rx="7" fill="#fffdfa"
            stroke="rgba(28,25,23,0.16)" filter="url(#paper-shadow)"/>
      <text x="128" y="463" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">AGENT.PROCESSEVENTS() · CORE BARRIER</text>
      <text x="128" y="488" fill="#1c1917" font-size="16" font-family="'Geist', sans-serif"
            font-weight="600">先更新 state，再等待 Agent.subscribe 的 core listeners</text>
      <rect x="128" y="504" width="768" height="25" rx="3" fill="#f3eee7"/>
      <text x="140" y="521" fill="#57534e" font-size="10" font-family="'Geist Mono', monospace">streamingMessage = event.message → await listener(event) → 当前 core 事件完成</text>
    </g>
    <line x1="62" y1="506" x2="62" y2="565" stroke="#b5523a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 05 · AgentSession -->
    <g>
      <circle cx="62" cy="622" r="20" fill="#faf7f2" stroke="#b5523a" stroke-width="1.3"/>
      <text x="62" y="626" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace"
            font-weight="600" text-anchor="middle">05</text>
      <rect x="104" y="568" width="816" height="132" rx="7" fill="#fffdfa"
            stroke="rgba(28,25,23,0.16)" filter="url(#paper-shadow)"/>
      <text x="128" y="593" fill="#b5523a" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">AGENTSESSION · EXTENSION + SESSION FAN-OUT</text>
      <text x="128" y="618" fill="#1c1917" font-size="16" font-family="'Geist', sans-serif"
            font-weight="600">等待扩展处理，再同步调用 Session listeners</text>
      <rect x="128" y="634" width="300" height="25" rx="3" fill="rgba(181,82,58,0.07)"/>
      <text x="140" y="651" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace">await _emitExtensionEvent(event)</text>
      <rect x="440" y="634" width="456" height="25" rx="3" fill="#f3eee7"/>
      <text x="452" y="651" fill="#57534e" font-size="10" font-family="'Geist Mono', monospace">_emit(event) · 不 await listener 返回的 Promise</text>
      <text x="128" y="681" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">持久化发生在 message_end：SessionManager 保存最终消息，而不是每个 text_delta。</text>
    </g>
    <line x1="62" y1="643" x2="62" y2="721" stroke="#b5523a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 06 · TUI -->
    <g>
      <circle cx="62" cy="770" r="20" fill="#b5523a"/>
      <text x="62" y="774" fill="#faf7f2" font-size="10" font-family="'Geist Mono', monospace"
            font-weight="600" text-anchor="middle">06</text>
      <rect x="104" y="724" width="816" height="120" rx="7" fill="rgba(181,82,58,0.055)"
            stroke="#b5523a" stroke-width="1.2" filter="url(#paper-shadow)"/>
      <text x="128" y="749" fill="#b5523a" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">INTERACTIVE MODE · TUI</text>
      <text x="128" y="774" fill="#1c1917" font-size="16" font-family="'Geist', sans-serif"
            font-weight="600">读取累计 event.message，而不是自己提取 delta</text>
      <rect x="128" y="790" width="768" height="25" rx="3" fill="#fffdfa" stroke="rgba(181,82,58,0.24)"/>
      <text x="140" y="807" fill="#b5523a" font-size="10" font-family="'Geist Mono', monospace">streamingComponent.updateContent(event.message) → TUI 差分渲染 → 终端出现“你”</text>
      <text x="128" y="832" fill="#57534e" font-size="9" font-family="'Geist', sans-serif">下一次更新仍携带完整累计内容；渲染器只更新发生变化的终端区域。</text>
    </g>

    <!-- Await semantics -->
    <rect x="104" y="868" width="816" height="26" rx="3" fill="#f3eee7"/>
    <text x="128" y="885" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
          letter-spacing="0.03em">AWAIT 边界 · core listener ✓ · extension event ✓ · Session listener Promise ✕</text>
  </svg>
