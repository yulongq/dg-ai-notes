<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>两层消息：联合类型与协议边界</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf7f2;
    --ink: #1c1917;
    --muted: #57534e;
    --soft: #a8a29e;
    --rule: rgba(28,25,23,0.10);
    --accent: #b5523a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 3rem 1.5rem 2rem;
    line-height: 1.5;
  }
  .container { max-width: 1080px; margin: 0 auto; }
  .eyebrow {
    margin-bottom: 0.5rem;
    color: var(--muted);
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  h1 {
    margin-bottom: 0.5rem;
    font-family: 'Instrument Serif', 'Source Han Serif SC', serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .subtitle {
    max-width: 78ch;
    margin-bottom: 2rem;
    color: var(--muted);
    font-size: 14px;
  }
  .frame {
    overflow-x: auto;
    padding: 1.25rem;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: rgba(28,25,23,0.02);
  }
  svg {
    display: block;
    width: 100%;
    min-width: 960px;
    height: auto;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
    color: var(--soft);
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="container">
  <p class="eyebrow">PI-AGENT · 第 6 章 · TYPE LEDGER</p>
  <h1>两层消息：联合类型与协议边界</h1>
  <p class="subtitle">AgentMessage 由 pi-ai 的 3 种 Message 与 coding-agent 的 4 种自定义消息组成。convertToLlm 负责把自定义消息投影或过滤为 Message[]；随后 Provider adapter 才把这套统一内部协议翻译成各供应商的私有请求格式。</p>

  <div class="frame">
  <svg viewBox="0 0 960 790" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="diagram-title">AgentMessage 联合类型与两道协议边界</title>
    <desc id="diagram-desc">AgentMessage 等于三种 pi-ai Message 加四种 coding-agent 自定义消息。convertToLlm 将自定义消息投影或过滤为 pi-ai Message 数组，Provider adapter 再翻译为供应商私有协议。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
      </marker>
      <style>
        .sans { font-family: 'Geist', 'PingFang SC', sans-serif; }
        .mono { font-family: 'Geist Mono', monospace; }
        .serif { font-family: 'Instrument Serif', 'Source Han Serif SC', serif; }
        .ink { fill: #1c1917; }
        .muted { fill: #57534e; }
        .soft { fill: #57534e; }
        .accent { fill: #b5523a; }
        .label { font-size: 9.5px; letter-spacing: .1em; }
        .body { font-size: 10px; }
        .small { font-size: 10px; }
        .title { font-size: 13px; font-weight: 600; }
      </style>
    </defs>

    <rect width="960" height="790" fill="#faf7f2"/>

    <!-- AgentMessage type ledger -->
    <rect x="34" y="28" width="892" height="336" rx="8" fill="#fff" stroke="rgba(28,25,23,.22)"/>
    <line x1="34" y1="82" x2="926" y2="82" stroke="rgba(28,25,23,.12)"/>
    <text x="58" y="53" class="mono accent label">AGENT STATE · UNION TYPE</text>
    <text x="58" y="72" class="sans ink title">AgentMessage[]</text>

    <rect x="792" y="43" width="108" height="26" rx="13" fill="rgba(181,82,58,.08)" stroke="rgba(181,82,58,.42)"/>
    <text x="846" y="60" class="mono accent" font-size="11" font-weight="600" text-anchor="middle">3 + 4 = 7</text>

    <!-- pi-ai Message column -->
    <rect x="58" y="104" width="388" height="230" rx="6" fill="rgba(28,25,23,.018)" stroke="rgba(28,25,23,.16)"/>
    <text x="78" y="130" class="mono muted label">PI-AI · UNIFIED INTERNAL PROTOCOL</text>
    <text x="78" y="153" class="sans ink title">Message · 3 种</text>
    <text x="424" y="153" class="sans soft body" text-anchor="end">不是供应商 API 格式</text>

    <rect x="78" y="174" width="348" height="40" rx="4" fill="#fff" stroke="rgba(28,25,23,.18)"/>
    <text x="94" y="199" class="mono ink body" font-weight="600">UserMessage</text>
    <text x="406" y="199" class="sans muted body" text-anchor="end">role: "user"</text>

    <rect x="78" y="224" width="348" height="40" rx="4" fill="#fff" stroke="rgba(28,25,23,.18)"/>
    <text x="94" y="249" class="mono ink body" font-weight="600">AssistantMessage</text>
    <text x="406" y="249" class="sans muted body" text-anchor="end">role: "assistant"</text>

    <rect x="78" y="274" width="348" height="40" rx="4" fill="#fff" stroke="rgba(28,25,23,.18)"/>
    <text x="94" y="299" class="mono ink body" font-weight="600">ToolResultMessage</text>
    <text x="406" y="299" class="sans muted body" text-anchor="end">role: "toolResult"</text>

    <!-- CustomAgentMessages column -->
    <rect x="466" y="104" width="436" height="230" rx="6" fill="rgba(181,82,58,.035)" stroke="rgba(181,82,58,.28)"/>
    <text x="486" y="130" class="mono accent label">CODING-AGENT · PROJECT-SPECIFIC STATE</text>
    <text x="486" y="153" class="sans ink title">CustomAgentMessages · 4 种</text>
    <text x="882" y="153" class="sans soft body" text-anchor="end">进入模型前需投影</text>

    <rect x="486" y="174" width="188" height="58" rx="4" fill="#fff" stroke="rgba(181,82,58,.32)"/>
    <text x="500" y="197" class="mono accent" font-size="10" font-weight="600">BashExecutionMessage</text>
    <text x="500" y="216" class="sans muted small">命令、输出、退出状态</text>

    <rect x="694" y="174" width="188" height="58" rx="4" fill="#fff" stroke="rgba(181,82,58,.32)"/>
    <text x="708" y="197" class="mono accent" font-size="10" font-weight="600">CompactionSummaryMessage</text>
    <text x="708" y="216" class="sans muted small">压缩后的历史摘要</text>

    <rect x="486" y="246" width="188" height="58" rx="4" fill="#fff" stroke="rgba(181,82,58,.32)"/>
    <text x="500" y="269" class="mono accent" font-size="10" font-weight="600">BranchSummaryMessage</text>
    <text x="500" y="288" class="sans muted small">被放弃分支的摘要</text>

    <rect x="694" y="246" width="188" height="58" rx="4" fill="#fff" stroke="rgba(181,82,58,.32)" stroke-dasharray="4 3"/>
    <text x="708" y="269" class="mono accent" font-size="10" font-weight="600">CustomMessage</text>
    <text x="708" y="288" class="sans muted small">扩展注入的通用消息</text>

    <!-- Both families enter convertToLlm -->
    <path d="M252 334 V386 H410" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <path d="M684 334 V386 H550" fill="none" stroke="#b5523a" marker-end="url(#arrow-accent)"/>
    <rect x="286" y="374" width="388" height="78" rx="7" fill="rgba(181,82,58,.065)" stroke="#b5523a" stroke-width="1.3"/>
    <text x="306" y="398" class="mono accent label">PROJECTION GATE · REQUIRED</text>
    <text x="306" y="421" class="sans ink title">convertToLlm(AgentMessage[]) → Message[]</text>
    <text x="306" y="439" class="sans muted body">pi-ai Message 原样通过；自定义消息按规则投影或过滤。</text>

    <!-- Exact projection rules -->
    <path d="M286 413 H164 V486" fill="none" stroke="#b5523a" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="34" y="486" width="260" height="78" rx="6" fill="rgba(181,82,58,.045)" stroke="rgba(181,82,58,.34)" stroke-dasharray="4 3"/>
    <text x="52" y="509" class="mono accent label">FILTER · ONLY THIS CASE</text>
    <text x="52" y="532" class="sans ink body" font-weight="600">BashExecutionMessage</text>
    <text x="52" y="550" class="mono muted small">excludeFromContext === true → []</text>

    <path d="M674 413 H796 V486" fill="none" stroke="#57534e" stroke-width="1"/>
    <rect x="666" y="486" width="260" height="78" rx="6" fill="rgba(28,25,23,.02)" stroke="rgba(28,25,23,.20)"/>
    <text x="684" y="509" class="mono muted label">PROJECT · ALL OTHER CUSTOM</text>
    <text x="684" y="532" class="sans ink body" font-weight="600">包括未排除的 Bash 消息</text>
    <text x="684" y="550" class="mono muted small">→ UserMessage</text>

    <!-- pi-ai Message output -->
    <line x1="480" y1="452" x2="480" y2="492" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="320" y="496" width="320" height="68" rx="6" fill="#fff" stroke="#1c1917"/>
    <text x="340" y="520" class="mono muted label">PI-AI OUTPUT</text>
    <text x="340" y="541" class="sans ink title">Message[] · 统一内部协议</text>
    <text x="340" y="558" class="mono soft small">User · Assistant · ToolResult</text>

    <!-- Separate provider boundary -->
    <line x1="480" y1="564" x2="480" y2="602" stroke="#57534e" marker-end="url(#arrow)"/>
    <rect x="286" y="606" width="388" height="70" rx="7" fill="rgba(28,25,23,.025)" stroke="rgba(28,25,23,.30)"/>
    <text x="306" y="630" class="mono muted label">PROVIDER BOUNDARY · SEPARATE STEP</text>
    <text x="306" y="653" class="sans ink title">Provider adapter</text>
    <text x="650" y="653" class="sans muted body" text-anchor="end">Message[] → 私有请求协议</text>

    <line x1="480" y1="676" x2="480" y2="710" stroke="#57534e" marker-end="url(#arrow)"/>
    <rect x="166" y="714" width="628" height="48" rx="24" fill="rgba(28,25,23,.045)" stroke="rgba(28,25,23,.20)"/>
    <text x="480" y="742" class="mono ink" font-size="10" text-anchor="middle">
      Anthropic Messages · OpenAI Chat / Responses · Google Generative AI · …
    </text>

    <text x="480" y="783" class="serif muted" font-size="12" font-style="italic" text-anchor="middle">
      内部表达可以丰富；每一道边界只做一种转换。
    </text>
  </svg>
  </div>

  <div class="footer">
    <span>PI-AGENT · 项目原理二次整理版</span>
    <span>260702 · CH06 · TYPE LEDGER</span>
  </div>
</div>
</body>
</html>
