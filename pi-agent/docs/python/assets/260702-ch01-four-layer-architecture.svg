  <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dag-title dag-desc">
    <title id="dag-title">Pi v0.80.2 四个核心包的直接依赖与四种使用模式</title>
    <desc id="dag-desc">pi-coding-agent 直接依赖 pi-tui、pi-agent-core 和 pi-ai；pi-agent-core 直接依赖 pi-ai。pi-tui 与 pi-ai 不依赖其他 pi 包。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
      </marker>
    </defs>
    <rect width="960" height="560" fill="#faf7f2"/>

    <!-- Product package -->
    <rect x="80" y="28" width="800" height="96" rx="8" fill="rgba(181,82,58,0.06)" stroke="#b5523a" stroke-width="1.4"/>
    <rect x="96" y="44" width="112" height="16" rx="2" fill="rgba(181,82,58,0.10)" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
    <text x="152" y="56" fill="#b5523a" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.08em">PRODUCT + SDK</text>
    <text x="120" y="88" fill="#1c1917" font-size="16" font-weight="600" font-family="'Geist', sans-serif">pi-coding-agent</text>
    <text x="120" y="108" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">完整 CLI · SDK · 系统提示词 · 内置工具 · 会话管理 · 扩展</text>
    <rect x="700" y="76" width="160" height="32" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.20)" stroke-width="0.8"/>
    <text x="780" y="96" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">createAgentSession()</text>

    <!-- coding-agent directly depends on all three peer packages -->
    <line x1="480" y1="124" x2="480" y2="162" stroke="#57534e" stroke-width="1"/>
    <line x1="190" y1="162" x2="775" y2="162" stroke="#57534e" stroke-width="1"/>
    <line x1="190" y1="162" x2="190" y2="202" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="470" y1="162" x2="470" y2="202" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="775" y1="162" x2="775" y2="202" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="496" y="148" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace">直接依赖</text>

    <!-- Independent terminal UI package -->
    <rect x="70" y="208" width="240" height="100" rx="7" fill="#ffffff" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
    <text x="88" y="230" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">TERMINAL UI</text>
    <text x="88" y="260" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', sans-serif">pi-tui</text>
    <text x="88" y="281" fill="#57534e" font-size="9" font-family="'Geist', sans-serif">行级差分渲染 · 组件树 · Markdown</text>
    <text x="88" y="297" fill="#a8a29e" font-size="8" font-family="'Geist', sans-serif">不依赖其他 pi-* 包</text>

    <!-- Agent runtime package -->
    <rect x="345" y="208" width="250" height="100" rx="7" fill="rgba(181,82,58,0.06)" stroke="#b5523a" stroke-width="1.2"/>
    <text x="363" y="230" fill="#b5523a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">AGENT RUNTIME</text>
    <text x="363" y="260" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', sans-serif">pi-agent-core</text>
    <text x="363" y="281" fill="#57534e" font-size="9" font-family="'Geist', sans-serif">Agent · 工具 · 事件 · Session</text>
    <text x="363" y="297" fill="#57534e" font-size="9" font-family="'Geist', sans-serif">Compaction · Skills · Harness</text>

    <!-- LLM abstraction package; peer with tui and agent-core -->
    <rect x="660" y="208" width="230" height="100" rx="7" fill="#ffffff" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
    <text x="678" y="230" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">LLM ABSTRACTION</text>
    <text x="678" y="260" fill="#1c1917" font-size="15" font-weight="600" font-family="'Geist', sans-serif">pi-ai</text>
    <text x="678" y="281" fill="#57534e" font-size="9" font-family="'Geist', sans-serif">统一 API · 流式 · Token / Cost</text>
    <text x="678" y="297" fill="#a8a29e" font-size="8" font-family="'Geist', sans-serif">不依赖其他 pi-* 包</text>

    <!-- agent-core also directly depends on pi-ai -->
    <line x1="595" y1="258" x2="654" y2="258" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="624" y="247" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">依赖</text>

    <text x="80" y="338" fill="#a8a29e" font-size="9" font-family="'Geist', sans-serif" font-style="italic">
      能力堆栈不等于安装依赖；pi-tui 与 pi-ai 同排，避免暗示二者之间存在依赖。
    </text>

    <!-- Four usage modes: print and JSON share the non-interactive category -->
    <line x1="80" y1="370" x2="880" y2="370" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
    <text x="80" y="394" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace"
          letter-spacing="0.14em">FOUR USAGE MODES</text>

    <g transform="translate(80, 408)">
      <rect width="180" height="54" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.20)" stroke-width="0.8"/>
      <text x="90" y="22" fill="#1c1917" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">交互模式</text>
      <text x="90" y="39" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pi</text>
    </g>
    <g transform="translate(280, 408)">
      <rect width="180" height="54" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.20)" stroke-width="0.8"/>
      <text x="90" y="22" fill="#1c1917" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">print / JSON</text>
      <text x="90" y="39" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">-p / --mode json</text>
    </g>
    <g transform="translate(480, 408)">
      <rect width="180" height="54" rx="4" fill="#ffffff" stroke="rgba(28,25,23,0.20)" stroke-width="0.8"/>
      <text x="90" y="22" fill="#1c1917" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RPC 模式</text>
      <text x="90" y="39" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">--mode rpc</text>
    </g>
    <g transform="translate(680, 408)">
      <rect width="180" height="54" rx="4" fill="rgba(181,82,58,0.06)" stroke="#b5523a" stroke-width="1"/>
      <text x="90" y="22" fill="#b5523a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SDK 模式</text>
      <text x="90" y="39" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">createAgentSession()</text>
    </g>

    <text x="80" y="496" fill="#a8a29e" font-size="9" font-family="'Geist', sans-serif" font-style="italic">
      README 将 print 与 JSON 合并为一种非交互使用类别；纯文本、事件 JSONL 与 RPC 的协议语义仍不同。
    </text>
  </svg>
